name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

# Least privilege, plus what Pages needs to publish via OIDC.
permissions:
  contents: read
  pages: write
  id-token: write

# One at a time, never cancelled: half-published is worse than stale.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm

      # Turns Pages on if it's off, so the first run needs no settings visit.
      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - run: pnpm install --frozen-lockfile

      - run: pnpm build

      # The SPA fallback (ADR 0004 §9), written by our Vite plugin.
      - name: Assert the SPA fallback shipped
        run: cmp dist/index.html dist/404.html

      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
