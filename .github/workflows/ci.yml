name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      # The WCAG 2.2 AA sweep lives here (src/theme/adapt.sweep.test.ts).
      # It is a hard gate: any failing pairing on any of the 348 combos in
      # either mode fails the build. See docs/adr/0002-combo-adaptation-model.md.
      # So is the scale sweep (src/lib/scale.sweep.test.ts): every contrast
      # promise of every ramp in the catalogue. See docs/adr/0012-combo-scale-model.md.
      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

      # The importable package (T4): every combo in every format, then packed,
      # installed into an empty project and imported by name — the `exports`
      # map only fails for a consumer, never in this repo's own tests.
      - name: Build the library
        run: pnpm build:lib

      - name: Smoke-test the packed library
        run: pnpm smoke:lib

      # `light-dark()` carries the whole neutral ramp across modes. Lightning
      # CSS downlevels it for older targets, and its polyfill keys off
      # `prefers-color-scheme` alone, which breaks the mode override in built
      # output only. `build.cssTarget` prevents that; this proves it.
      - name: Assert light-dark() survives minification
        run: grep -q "light-dark(" dist/assets/*.css

      # The SPA fallback (ADR 0004 §9): GitHub Pages has no rewrite rules, so
      # `404.html` is the rewrite. Without it every deep link 404s on reload —
      # a failure that only shows up on the deployed host, never in dev.
      - name: Assert the SPA fallback shipped
        run: cmp dist/index.html dist/404.html
