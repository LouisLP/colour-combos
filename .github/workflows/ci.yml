name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      # Includes two hard gates: the AA sweep (ADR 0002) and the scale sweep
      # (ADR 0012). One failing pairing in any combo fails the build.
      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

      # Pack, install and import by name: a broken `exports` map only fails for
      # a consumer.
      - name: Build the library
        run: pnpm build:lib

      - name: Smoke-test the packed library
        run: pnpm smoke:lib

      # The SPA fallback (ADR 0004 §9). Without it, deep links 404 on reload,
      # but only on the deployed host.
      - name: Assert the SPA fallback shipped
        run: cmp dist/index.html dist/404.html
